<!DOCTYPE html>
<html lang="en">
<script>
  const inventory = JSON.parse(localStorage.getItem('inventory') || '[]');
  const theadRow = document.querySelector('#productsTable thead tr');
  inventory.forEach(inv => {
    const th = document.createElement('th');
    th.textContent = inv.name;
    theadRow.appendChild(th);
  });
</script>
<head>
  <meta charset="UTF-8">
  <title>Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-root">
    <div class="material-card">
      <h1 class="app-content-title">Products Input</h1>

		<table id="productsTable">
			<thead>
			<tr>
			<th>Product Name</th>
			<th>Cost/Unit (€)</th>
			<th>Profit/Unit (€)</th>
			<th>Unit</th>
			<th>CO₂e/Unit</th>
			<!-- Inventory usage headers will be injected here -->
			<th>Remove</th>
			</tr>
			</thead>
			<tbody></tbody>
		</table>


		<div style="width: 100%; display: flex; justify-content: flex-start;">
			<button id="add-product-btn">Add Product</button>
		</div>

		<button id="save-products-btn">Save to XML</button>
			<input type="file" id="load-products-file" accept=".xml">
		<div style="display: flex; gap: 1rem; justify-content: flex-end; width: 100%;">
			<button id="back-to-inventory-btn" class="selector-btn">← Back</button>
			<button id="next-to-parameters-btn" class="selector-btn">Next →</button>
			<button onclick="sessionStorage.clear(); location.reload();">Reset Session</button>
		</div>

    <div class="tool-usage-note">
      <strong>How to use this screen:</strong>
      <ol>
        <li>Define your products and their cost/profit metrics.</li>
        <li>Save to XML for reuse or load an existing products file.</li>
        <li>Click Next to set optimization parameters.</li>
      </ol>
    </div>
  </div>

  <script src="products.js"></script>
</body>
</html>
